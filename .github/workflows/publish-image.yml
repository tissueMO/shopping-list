name: Publish Docker Image

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - name: app
            context: .
            image_suffix: ""
          - name: keep-api
            context: ./keep-api
            image_suffix: -keep-api
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Downcase repository name
        run: |
          echo "IMAGE_NAME=ghcr.io/$(echo "${{ github.repository }}" | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_ENV"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push ${{ matrix.name }} image
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          target: production
          push: true
          tags: |
            ${{ env.IMAGE_NAME }}${{ matrix.image_suffix }}:latest
            ${{ env.IMAGE_NAME }}${{ matrix.image_suffix }}:${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}

  trigger-deploy:
    needs: build-and-push
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Deployment Webhook
        env:
          WEBHOOK_URL: ${{ secrets.WEBHOOK_URL }}
          KEEP_API_WEBHOOK_URL: ${{ secrets.KEEP_API_WEBHOOK_URL }}
        run: |
          curl --fail-with-body --silent --show-error --request POST \
            --header 'Content-Type: application/json' "$WEBHOOK_URL"
          curl --fail-with-body --silent --show-error --request POST \
            --header 'Content-Type: application/json' "$KEEP_API_WEBHOOK_URL"
