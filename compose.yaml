services:
  app:
    build:
      context: .
      target: development
    ports:
      - "3000:3000"
    volumes:
      - .:/app
      - /app/node_modules
      - /app/.nuxt
    env_file:
      - .env
    depends_on:
      - redis
      - keep-api

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

  keep-api:
    build:
      context: ./keep-api
    ports:
      - "8000:8000"
    volumes:
      - ./keep-api:/app
    env_file:
      - .env
